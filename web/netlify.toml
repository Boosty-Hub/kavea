# Configuración del sitio PÚBLICO (kavea.ai).
#
# Vive aquí y no en la raíz porque hay dos sitios de Netlify sobre este mismo
# repositorio: un netlify.toml en la raíz aplicaría a los dos y el de la
# aplicación heredaría esta configuración.
#
# La `base` de cada sitio se fija en el panel de Netlify; Netlify busca el
# netlify.toml dentro de esa base.

[build]
  # `npm ci` VA AQUÍ Y NO SE PUEDE QUITAR, aunque Netlify ya tenga un paso de
  # instalación propio. El 5-sep el sitio llevaba once días sin desplegar y el
  # log lo dijo en tres líneas: «No pnpm workspaces detected» → «Installing npm
  # packages using pnpm version 9.15.0» → «Scope: all 2 workspace projects», y
  # después `sh: 1: astro: not found`.
  #
  # El motivo: `"packageManager": "pnpm@9.15.0"` en la package.json de la RAÍZ
  # enciende Corepack, pnpm sube a la raíz, instala los dos proyectos del
  # workspace —`app` y `scripts`— y se salta `web/`, que `pnpm-workspace.yaml`
  # excluye a propósito. O sea que el paso de instalación de Netlify no instala
  # nada de este sitio y `web/package-lock.json` no se usa nunca.
  #
  # Funcionaba en agosto porque la imagen de build era otra: la de hoy dice
  # `noble-new-builds` y detecta el gestor de otra forma. La lección es que este
  # sitio no puede depender de que Netlify adivine npm; se lo decimos nosotros.
  # Cuesta unos segundos de instalación repetida en un sitio estático de cinco
  # páginas, y compra un despliegue reproducible desde el lockfile versionado.
  command = "npm ci && npm run build"
  publish = "dist"

# Con dos sitios sobre un repositorio, cada commit dispara los dos builds.
# `ignore` corta el que no toca. Se evalúa desde `base`, así que "." es la carpeta
# de este sitio.
#
# SE COMPARA CONTRA LO ÚLTIMO CONSTRUIDO, no contra `HEAD^`. La versión anterior
# decía `git diff --quiet HEAD^ HEAD -- .` y eso mira UN SOLO commit: el 24-ago se
# subieron cinco de golpe y el último solo tocaba `docs/` y `scripts/`, así que
# Netlify canceló el build por «no content change» y dejó SIN DESPLEGAR los
# cambios de `app/` de los commits anteriores. El fallo se ve —el despliegue sale
# en rojo— pero el motivo que da suena a que no había nada que hacer.
#
# `CACHED_COMMIT_REF` es el commit del último build con éxito y `COMMIT_REF` el
# actual; entre esos dos está todo lo que falta por construir.
#
# CON RESPALDO, porque una variable vacía aquí INVIERTE el sentido: `git diff
# --quiet "" $COMMIT_REF -- .` compara el árbol de trabajo contra ese commit,
# sale limpio y CANCELA el build. Es el fallo peor de los dos, así que si la
# variable no está se cae al comportamiento anterior en vez de a lo desconocido.
#
# YA SE COMPROBÓ, Y FALLÓ. El 5-sep esta regla canceló un commit que SÍ tocaba
# `web/` —el que añadió el botón de Facebook— y la misma orden en local daba
# exit 1, o sea «construir». Al forzar un build con caché limpia sí arrancó, y
# esa es la pista: sin caché `CACHED_COMMIT_REF` viene vacío, cae a `HEAD^` y
# compara bien; con caché devolvió 0. La explicación que encaja con todo lo
# observado es que `CACHED_COMMIT_REF` valía lo mismo que `COMMIT_REF`, y
# comparar un commit consigo mismo sale limpio y cancela SIEMPRE.
#
# De ahí la guarda de delante: si los dos refs son iguales, no hay nada que
# comparar y se construye. Un build de más cuesta catorce segundos; un build de
# menos deja el sitio público once días sin desplegar sin que nadie lo note,
# porque el despliegue sale en rojo con un motivo que suena a «no había nada que
# hacer». Ante la duda, esta regla construye.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet ${CACHED_COMMIT_REF:-HEAD^} ${COMMIT_REF:-HEAD} -- ."

[build.environment]
  NODE_VERSION = "22"

# Cabeceras de seguridad. Deliberadamente NO se activa ninguna protección de bots
# ni challenge de Netlify: el rastreador de Meta debe poder leer la política de
# privacidad y las instrucciones de eliminación de datos y recibir un 200.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # `connect-src` se declara explícitamente porque el formulario de /demo habla
    # con Postgres desde el navegador. Sin esta línea heredaría `default-src
    # 'self'` y el envío fallaría en silencio: el sitio es estático y no hay
    # servidor propio al que enviarlo.
    #
    # Se nombra el proyecto entero y no una ruta: la CSP no distingue rutas. Lo
    # que NO se hace es abrir `script-src` a 'unsafe-inline'; el script del
    # formulario se empaqueta como fichero y se sirve desde el propio sitio.
    # `form-action` incluye los subdominios de kavea.ai por el formulario de
    # /entrar: envía a `/ir`, que es del propio sitio, pero el CDN responde con un
    # 302 al espacio del cliente. Los navegadores comprueban form-action CONTRA EL
    # DESTINO DE LA REDIRECCIÓN, no solo contra el destino declarado, así que con
    # `'self'` a secas el envío se bloquea sin error visible: el formulario
    # simplemente no hace nada.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' https://sdazqohyjzzylwbkvovx.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.kavea.ai"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
