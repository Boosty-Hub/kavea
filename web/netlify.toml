# Configuración del sitio PÚBLICO (kavea.ai).
#
# Vive aquí y no en la raíz porque hay dos sitios de Netlify sobre este mismo
# repositorio: un netlify.toml en la raíz aplicaría a los dos y el de la
# aplicación heredaría esta configuración.
#
# La `base` de cada sitio se fija en el panel de Netlify; Netlify busca el
# netlify.toml dentro de esa base.

[build]
  command = "npm run build"
  publish = "dist"

# Con dos sitios sobre un repositorio, cada commit dispara los dos builds.
# `ignore` corta el que no toca. Se evalúa desde `base`, así que "." es web/.
  ignore = "git diff --quiet HEAD^ HEAD -- ."

[build.environment]
  NODE_VERSION = "22"

# Cabeceras de seguridad. Deliberadamente NO se activa ninguna protección de bots
# ni challenge de Netlify: el rastreador de Meta debe poder leer la política de
# privacidad y las instrucciones de eliminación de datos y recibir un 200.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
