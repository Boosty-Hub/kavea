# Configuración del sitio de la APLICACIÓN (*.kavea.ai y admin.kavea.ai).
#
# Vive aquí y no en la raíz porque hay dos sitios de Netlify sobre este
# repositorio. La `base` se fija en el panel; Netlify busca este fichero dentro
# de esa base.

[build]
  command = "pnpm build"
  publish = ".next"

# Con dos sitios sobre un repositorio, cada commit dispara los dos builds.
# `ignore` corta el que no toca. Se evalúa desde `base`, así que "." es la carpeta
# de este sitio.
#
# SE COMPARA CONTRA LO ÚLTIMO CONSTRUIDO, no contra `HEAD^`. La versión anterior
# decía `git diff --quiet HEAD^ HEAD -- .` y eso mira UN SOLO commit: el 24-ago se
# subieron cinco de golpe y el último solo tocaba `docs/` y `scripts/`, así que
# Netlify canceló el build por «no content change» y dejó SIN DESPLEGAR los
# cambios de `app/` de los commits anteriores. El fallo se ve —el despliegue sale
# en rojo— pero el motivo que da suena a que no había nada que hacer.
#
# `CACHED_COMMIT_REF` es el commit del último build con éxito y `COMMIT_REF` el
# actual; entre esos dos está todo lo que falta por construir.
#
# CON RESPALDO, porque una variable vacía aquí INVIERTE el sentido: `git diff
# --quiet "" $COMMIT_REF -- .` compara el árbol de trabajo contra ese commit,
# sale limpio y CANCELA el build. Es el fallo peor de los dos, así que si la
# variable no está se cae al comportamiento anterior en vez de a lo desconocido.
#
# SIN COMPROBAR TODAVÍA bajo la forma que falló. El commit que arregla esto toca
# esta misma carpeta, así que la regla vieja también habría construido: la prueba
# de verdad es el siguiente empujón de varios commits cuyo último no toque aquí.
  ignore = "git diff --quiet ${CACHED_COMMIT_REF:-HEAD^} ${COMMIT_REF:-HEAD} -- ."

[build.environment]
  NODE_VERSION = "22"

# Versión fijada a propósito. El Next Runtime es lo que convierte el middleware
# en una Edge Function de Netlify y lo que decide cómo se sirven las rutas del
# App Router: una actualización automática cambia ese comportamiento sin que
# nadie lo pida.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
