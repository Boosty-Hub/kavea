name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la toma de `packageManager` en package.json. Declararla
      # en los dos sitios hace que la acción falle por versiones en conflicto.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Comprobación de tipos
        run: pnpm --filter @kavea/app typecheck

      # Cuatro veces se desplegó una actividad nueva que el hilo mostraba con su
      # identificador técnico —«tarjeta valor», «archivo subido»— porque el
      # `case` se quedó sin añadir. No lo detiene el compilador y solo se ve
      # mirando la pantalla, así que sobrevive a los despliegues.
      - name: Toda actividad sabe decirse en castellano
        run: node scripts/comprobar-actividades.mjs

      # Los dos callbacks que Meta exige para el App Review dependen enteros de
      # esta verificación, y su trampa —firmar la base64 sin decodificar— no la
      # ve el compilador. Además es hoy lo único que ejecuta una línea de
      # supabase/functions antes de desplegarla: las Edge Functions no se
      # typechequean aquí.
      - name: El signed_request se verifica como Meta lo firma
        run: node --import tsx scripts/comprobar-firma.mjs

      # Las variables son FALSAS a propósito. El build no debe hablar con
      # Supabase; si lo hiciera, es un fallo de diseño y conviene descubrirlo
      # aquí y no en producción.
      - name: Build
        run: pnpm --filter @kavea/app build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-falsa-de-build
          NEXT_PUBLIC_DOMINIO_RAIZ: kavea.ai

  sitio-publico:
    name: Sitio público
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `npm install` y no `npm ci`: el lockfile se genera en Windows y no
      # incluye las dependencias opcionales de Linux que arrastra sharp, así que
      # `ci` falla por lockfile desincronizado en el runner. Las versiones
      # siguen fijadas por el lockfile; lo único que se pierde es el rechazo
      # ante una desincronización, que aquí es permanente por plataforma.
      - run: npm install --no-audit --no-fund
        working-directory: web

      - run: npm run build
        working-directory: web

      # El rastreador de Meta tiene que poder leer estas páginas y recibir 200.
      # Un enlace roto es causa de rechazo del App Review, sin más explicación.
      - name: Las páginas legales existen en el build
        working-directory: web
        run: |
          for p in privacidad terminos eliminacion-de-datos; do
            test -f "dist/$p/index.html" || { echo "FALTA dist/$p/index.html"; exit 1; }
          done
          echo "Las tres paginas legales estan en el build."

      # Cero JavaScript en cliente no es una preferencia estética: es lo que
      # garantiza que la página se lea entera sin ejecutar nada.
      #
      # LA EXCEPCIÓN ESTÁ NOMBRADA, NO ABIERTA. `/demo` carga un script porque el
      # formulario habla con Postgres, y tuvo que ser un fichero y no inline
      # porque la CSP del sitio es `script-src 'self'`. Esta comprobación llevaba
      # desde el 3 de agosto en rojo, desde el commit que arregló el formulario:
      # nadie actualizó el invariante y el job se volvió ruido que se ignora.
      #
      # La lista blanca es de UNA entrada, y solo en la página que la necesita.
      # Cualquier otro script, o una isla hidratada que se cuele, sigue tumbando
      # el build. Y de paso se comprueba que `demo.js` EXISTE: ese formulario ya
      # estuvo roto una vez sin dar un solo error, y desplegarlo sin su script es
      # exactamente cómo vuelve a pasar.
      - name: Sin JavaScript salvo el formulario de demo
        working-directory: web
        run: |
          js=$(find dist -name '*.js' | sed 's|^dist/||' | grep -vx 'demo.js' || true)
          if [ -n "$js" ]; then
            echo "JavaScript no esperado en el sitio publico:"; echo "$js"; exit 1
          fi
          html=$(grep -rl '<script' dist --include='*.html' | sed 's|^dist/||' | grep -vx 'demo/index.html' || true)
          if [ -n "$html" ]; then
            echo "Etiquetas script en HTML donde no debe haberlas:"; echo "$html"; exit 1
          fi
          test -f dist/demo.js || { echo "Falta dist/demo.js: el formulario de demo no haria nada."; exit 1; }
          echo "Sin JavaScript salvo dist/demo.js, y solo /demo lo carga."

  base-de-datos:
    name: Esquema desde cero y aislamiento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión fijada, nunca `latest`: una publicación del CLI rompería CI en
      # un PR que no tocó la base de datos.
      #
      # Tiene que soportar Postgres 17, que es lo que corre producción. Probar
      # el esquema contra 15 mientras producción va en 17 es justo la deriva
      # entre entornos que este trabajo existe para evitar.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # `supabase start` aplica por sí solo todo lo que hay en
      # supabase/migrations, en orden lexicográfico. Reaplicarlas después a mano
      # falla con "type already exists", que es como se descubrió esto.
      - name: Levantar el stack y aplicar el esquema desde cero
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      - name: Exportar la URL de la base
        run: |
          echo "DB=$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      # Que `start` no diera error no significa que aplicara nada: si el CLI
      # cambiara de convenio de nombres, se saltaría las migraciones en silencio
      # y los canarios pasarían sobre una base vacía.
      - name: El esquema existe de verdad
        run: |
          n=$(psql "$DB" -tAc "select count(*) from pg_tables where schemaname='public';")
          test "$n" -ge 14 || { echo "Solo $n tablas en public: las migraciones no se aplicaron"; exit 1; }
          echo "$n tablas en public."

      - name: Canarios de esquema
        run: psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/canarios.sql

      - name: Aislamiento entre organizaciones
        run: psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/aislamiento.sql

      # Volver a aplicar la semilla no puede duplicar ni fallar. Es lo que
      # separa una migración reproducible de una que solo funcionó una vez.
      - name: La semilla es idempotente
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/0013_semilla_boosty.sql
          n=$(psql "$DB" -tAc "select count(*) from public.organizations where slug='boosty';")
          test "$n" = "1" || { echo "La semilla duplico: $n filas"; exit 1; }
          echo "Semilla idempotente."

  coherencia:
    name: Coherencia entre proveedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El docs/06 avisa de que la configuración vive en más de un sitio y puede
      # desincronizarse, y de que se mitiga con una prueba, no con disciplina.
      - name: La versión de Graph API vive en un solo sitio
        run: |
          # Ninguna versión literal en un path del repositorio.
          if grep -rEn 'graph\.facebook\.com/v[0-9]+\.[0-9]+' \
               --include='*.ts' --include='*.tsx' --include='*.sql' \
               app supabase scripts 2>/dev/null; then
            echo "Hay una version de Graph API escrita a mano en un path."
            echo "Debe leerse siempre de GRAPH_API_VERSION."
            exit 1
          fi
          echo "Sin versiones literales en paths."

      - name: El cliente de servicio no se puede importar desde el navegador
        run: |
          # server-only en la primera linea es la unica guarda fiable contra que
          # la clave de servicio acabe en el bundle.
          head -1 app/lib/supabase/servicio.ts | grep -q "server-only" || {
            echo "app/lib/supabase/servicio.ts no empieza por server-only"; exit 1; }
          # Y ningun componente de cliente puede importarlo.
          if grep -rln "use client" app --include='*.tsx' | xargs -r grep -ln "supabase/servicio" ; then
            echo "Un componente de cliente importa el cliente de servicio."; exit 1
          fi
          echo "El cliente de servicio esta acotado al servidor."

      - name: Nada usa las claves legacy de Supabase
        run: |
          # El proyecto tiene deshabilitadas las claves antiguas basadas en JWT.
          # Reintroducirlas rompe en produccion y no en local, porque el CLI
          # local las sigue emitiendo: por eso la guarda vive aqui.
          #
          # Se excluye este fichero: contiene los patrones y se detectaria a si
          # mismo. Cualquier OTRO workflow si se revisa.
          # La plataforma de Edge Functions inyecta una variable con el nombre
          # clasico de la clave de rol de servicio, pero en este proyecto esa
          # clave esta DESHABILITADA. Usarla seria depender de algo que ya no
          # autentica, asi que el patron tambien la caza aqui: el codigo usa
          # KAVEA_SUPABASE_SECRET, con nombre propio y sin herencia del entorno.
          if grep -rEn 'SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY' \
               --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.toml' \
               --exclude='ci.yml' \
               app supabase scripts .github 2>/dev/null; then
            echo "Hay una referencia a las claves antiguas de Supabase."
            echo "Se usan sb_publishable_* y sb_secret_*."
            exit 1
          fi
          # Y ninguna clave con forma de JWT en el arbol.
          if grep -rEn 'eyJhbGciOiJIUzI1NiIs' . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
               --exclude-dir=dist --exclude='ci.yml' 2>/dev/null; then
            echo "Hay algo con forma de JWT antiguo en el arbol."
            exit 1
          fi
          echo "Sin claves antiguas."

      - name: Ningun revoke nuevo de funcion se queda en `from anon`
        run: |
          # `revoke ... from anon` NO QUITA NADA EN UNA FUNCION.
          #
          # Postgres concede EXECUTE a `public` en toda funcion nueva, y `anon`
          # hereda de `public`: revocarle a `anon` lo que tiene por herencia lo
          # deja igual. El 23-ago-2026 eso dejo `credencial_whatsapp_de_conexion`
          # devolviendo el blob cifrado del token de WhatsApp a cualquiera con la
          # clave publicable. Lo correcto es `from public, anon`.
          #
          # SOLO FUNCIONES, y no es un olvido: en una TABLA el rol `public` no
          # recibe nada por defecto -lo comprobado el 23-ago: el relacl de
          # `messages` lista postgres, anon, authenticated y service_role, sin
          # entrada de PUBLIC-, asi que ahi `from anon, authenticated` si es
          # completo. Es la asimetria que hace tan facil equivocarse.
          #
          # GRANDFATHERING HASTA LA 0079, y no por pereza: esas migraciones ya
          # estan aplicadas y este repositorio no reescribe migraciones -la 0077
          # y la 0084 corrigieron las suyas con migraciones NUEVAS, que es la
          # convencion-. Su texto sigue siendo erroneo y por eso existe esta
          # guarda: para que no se copie. De la 0080 en adelante, se falla.
          python3 - <<'EOF'
          import glob, os, re, sys
          malos = []
          for f in sorted(glob.glob('supabase/migrations/*.sql')):
              n = os.path.basename(f)[:4]
              if not n.isdigit() or int(n) <= 79:
                  continue
              cuerpo = open(f, encoding='utf-8').read()
              # Sin comentarios: la 0084 EXPLICA el patron y no debe cazarse.
              cuerpo = re.sub(r'--[^\n]*', '', cuerpo)
              for sent in cuerpo.split(';'):
                  llano = ' '.join(sent.split())
                  if not re.search(r'\brevoke\b', llano, re.I):
                      continue
                  if not re.search(r'\bon\s+function\b', llano, re.I):
                      continue
                  # La lista de roles es lo que va tras el ULTIMO `from`: antes
                  # puede aparecer `public` como ESQUEMA, que no cuenta.
                  partes = re.split(r'\bfrom\b', llano, flags=re.I)
                  if len(partes) < 2:
                      continue
                  roles = partes[-1]
                  if re.search(r'\banon\b', roles, re.I) and not re.search(r'\bpublic\b', roles, re.I):
                      malos.append(f'{os.path.basename(f)}: {llano[:110]}')
          if malos:
              print('Un revoke que se queda en `anon` no quita el permiso de `public`:')
              for m in malos:
                  print('  ' + m)
              print('Escribe `from public, anon`.')
              sys.exit(1)
          print('Ningun revoke nuevo de funcion revoca solo de anon.')
          EOF

      - name: Los tags muertos de Meta no aparecen
        run: |
          # CONFIRMED_EVENT_UPDATE, ACCOUNT_UPDATE y POST_PURCHASE_UPDATE
          # devuelven error 100 desde el 27-abr-2026. No es una advertencia
          # futura: es el estado actual.
          if grep -rn 'CONFIRMED_EVENT_UPDATE\|POST_PURCHASE_UPDATE' \
               --include='*.ts' --include='*.tsx' app supabase scripts 2>/dev/null; then
            echo "Hay tags de Meta muertos en el codigo."
            exit 1
          fi
          echo "Sin tags muertos."

  secretos:
    name: Fuga de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar credenciales en el árbol
        run: |
          # Patrones de las credenciales que este proyecto usa de verdad.
          # El .env.example lleva marcadores, no valores, y se excluye.
          patron='sb_secret_[A-Za-z0-9_-]{20,}|sbp_[a-f0-9]{40}|re_[A-Za-z0-9]{8}_[A-Za-z0-9]{20,}|nfp_[A-Za-z0-9]{30,}|EAA[A-Za-z0-9]{60,}'
          if grep -rEn "$patron" . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
               --exclude-dir=dist --exclude='*.lock' --exclude='pnpm-lock.yaml'; then
            echo ""
            echo "Hay algo que parece una credencial en el arbol."
            exit 1
          fi
          echo "Sin credenciales en el arbol."
