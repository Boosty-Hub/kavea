name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la toma de `packageManager` en package.json. Declararla
      # en los dos sitios hace que la acción falle por versiones en conflicto.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Comprobación de tipos
        run: pnpm --filter @kavea/app typecheck

      # Las variables son FALSAS a propósito. El build no debe hablar con
      # Supabase; si lo hiciera, es un fallo de diseño y conviene descubrirlo
      # aquí y no en producción.
      - name: Build
        run: pnpm --filter @kavea/app build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-falsa-de-build
          NEXT_PUBLIC_DOMINIO_RAIZ: kavea.ai

  sitio-publico:
    name: Sitio público
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # El rastreador de Meta tiene que poder leer estas páginas y recibir 200.
      # Un enlace roto es causa de rechazo del App Review, sin más explicación.
      - name: Las páginas legales existen en el build
        working-directory: web
        run: |
          for p in privacidad terminos eliminacion-de-datos; do
            test -f "dist/$p/index.html" || { echo "FALTA dist/$p/index.html"; exit 1; }
          done
          echo "Las tres paginas legales estan en el build."

      # Cero JavaScript en cliente no es una preferencia estética: es lo que
      # garantiza que la página se lea entera sin ejecutar nada.
      - name: Cero JavaScript en el sitio público
        working-directory: web
        run: |
          if find dist -name '*.js' | grep -q .; then
            echo "El sitio publico emitio JavaScript:"; find dist -name '*.js'; exit 1
          fi
          if grep -rl '<script' dist --include='*.html' | grep -q .; then
            echo "Hay etiquetas script en el HTML:"; grep -rl '<script' dist --include='*.html'; exit 1
          fi
          echo "Sin JavaScript y sin etiquetas script."

  base-de-datos:
    name: Esquema desde cero y aislamiento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión fijada, nunca `latest`: una publicación del CLI rompería CI en
      # un PR que no tocó la base de datos.
      #
      # Tiene que soportar Postgres 17, que es lo que corre producción. Probar
      # el esquema contra 15 mientras producción va en 17 es justo la deriva
      # entre entornos que este trabajo existe para evitar.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Levantar el stack local
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      # Se aplican una a una en lugar de con `db reset`, para no depender del
      # convenio de nombres con marca temporal del CLI. El orden lexicográfico
      # del prefijo 00NN es el orden de aplicación.
      - name: Aplicar las migraciones desde cero
        run: |
          for f in supabase/migrations/*.sql; do
            echo "-- $f"
            psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')" \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Canarios de esquema
        run: |
          psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')" \
            -v ON_ERROR_STOP=1 -f supabase/tests/canarios.sql

      - name: Aislamiento entre organizaciones
        run: |
          psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')" \
            -v ON_ERROR_STOP=1 -f supabase/tests/aislamiento.sql

      # Aplicar dos veces tiene que fallar de forma ruidosa, no dejar el esquema
      # a medias. Es lo que separa una migración reproducible de una que solo
      # funcionó una vez.
      - name: La semilla es idempotente
        run: |
          psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')" \
            -v ON_ERROR_STOP=1 -q -f supabase/migrations/0013_semilla_boosty.sql
          n=$(psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')" \
            -tAc "select count(*) from public.organizations where slug='boosty';")
          test "$n" = "1" || { echo "La semilla duplico: $n filas"; exit 1; }
          echo "Semilla idempotente."

  coherencia:
    name: Coherencia entre proveedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El docs/06 avisa de que la configuración vive en más de un sitio y puede
      # desincronizarse, y de que se mitiga con una prueba, no con disciplina.
      - name: La versión de Graph API vive en un solo sitio
        run: |
          # Ninguna versión literal en un path del repositorio.
          if grep -rEn 'graph\.facebook\.com/v[0-9]+\.[0-9]+' \
               --include='*.ts' --include='*.tsx' --include='*.sql' \
               app supabase scripts 2>/dev/null; then
            echo "Hay una version de Graph API escrita a mano en un path."
            echo "Debe leerse siempre de GRAPH_API_VERSION."
            exit 1
          fi
          echo "Sin versiones literales en paths."

      - name: El cliente de servicio no se puede importar desde el navegador
        run: |
          # server-only en la primera linea es la unica guarda fiable contra que
          # la clave de servicio acabe en el bundle.
          head -1 app/lib/supabase/servicio.ts | grep -q "server-only" || {
            echo "app/lib/supabase/servicio.ts no empieza por server-only"; exit 1; }
          # Y ningun componente de cliente puede importarlo.
          if grep -rln "use client" app --include='*.tsx' | xargs -r grep -ln "supabase/servicio" ; then
            echo "Un componente de cliente importa el cliente de servicio."; exit 1
          fi
          echo "El cliente de servicio esta acotado al servidor."

      - name: Los tags muertos de Meta no aparecen
        run: |
          # CONFIRMED_EVENT_UPDATE, ACCOUNT_UPDATE y POST_PURCHASE_UPDATE
          # devuelven error 100 desde el 27-abr-2026. No es una advertencia
          # futura: es el estado actual.
          if grep -rn 'CONFIRMED_EVENT_UPDATE\|POST_PURCHASE_UPDATE' \
               --include='*.ts' --include='*.tsx' app supabase scripts 2>/dev/null; then
            echo "Hay tags de Meta muertos en el codigo."
            exit 1
          fi
          echo "Sin tags muertos."

  secretos:
    name: Fuga de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar credenciales en el árbol
        run: |
          # Patrones de las credenciales que este proyecto usa de verdad.
          # El .env.example lleva marcadores, no valores, y se excluye.
          patron='sb_secret_[A-Za-z0-9_-]{20,}|sbp_[a-f0-9]{40}|re_[A-Za-z0-9]{8}_[A-Za-z0-9]{20,}|nfp_[A-Za-z0-9]{30,}|EAA[A-Za-z0-9]{60,}'
          if grep -rEn "$patron" . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
               --exclude-dir=dist --exclude='*.lock' --exclude='pnpm-lock.yaml'; then
            echo ""
            echo "Hay algo que parece una credencial en el arbol."
            exit 1
          fi
          echo "Sin credenciales en el arbol."
